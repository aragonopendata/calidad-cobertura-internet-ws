#Postgresql default configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=@driver_postgresql@

spring.datasource.test-on-borrow=true
spring.datasource.validation-query=SELECT 1;
spring.datasource.validation-interval=30000

server.contextPath=/servicios/indicadores
server.servlet-path=/*

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

driver.postgresql = @driver_postgresql@
#JPA configuration
spring.jpa.database=POSTGRESQL
ddl-auto=@jpa_policy@
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

#geopub
geopub.username=${GEOPUB_USER}
geopub.password=${GEOPUB_PASSWORD}
geopub.url=${GEOPUB_URL}

logging.level.cobertura=DEBUG

cors.origins=${CORS_ORIGINS:http://localhost:8000,http://localhost:4200,https://opendata.aragon.es}
